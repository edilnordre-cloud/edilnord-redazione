<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&display=swap">
<style>
  :root{--dark:#152319;--sage:#9dc0aa;--white:#fff;--sage-soft:#c9ddcf;--sage-dim:#6f8779;}
  *{box-sizing:border-box;margin:0}
  html,body{width:360px;height:640px;overflow:hidden;background:#0b120d;font-family:"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:absolute;inset:0}
  .bg{position:absolute;inset:0;transform:scale(1.04);animation:ken 18s linear forwards}
  .bg img,.bg video{width:100%;height:100%;object-fit:cover}
  @keyframes ken{from{transform:scale(1.02)}to{transform:scale(1.12)}}
  .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,18,13,.5) 0%,rgba(11,18,13,.12) 30%,rgba(11,18,13,.42) 60%,rgba(11,18,13,.92) 100%)}
  .prog{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:4px;z-index:6}
  .seg{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden}
  .seg i{display:block;height:100%;width:0;background:#fff;border-radius:3px}
  .who{position:absolute;top:26px;left:14px;display:flex;align-items:center;gap:8px;z-index:6}
  .who .av{width:30px;height:30px;border-radius:50%;background:conic-gradient(from 210deg,var(--sage),#e7f2ea,var(--sage-dim),var(--sage));display:grid;place-items:center;font-family:"Anton";font-size:13px;color:var(--dark)}
  .who .nm{font-size:13px;font-weight:800;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6)}
  .who .nm span{display:block;font-size:10px;font-weight:600;color:var(--sage-soft)}
  .cap{position:absolute;left:18px;right:18px;bottom:70px;z-index:5}
  .frame{position:absolute;left:0;right:0;bottom:0;opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s ease}
  .frame.on{opacity:1;transform:none}
  .eyebrow{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--dark);background:var(--sage);padding:4px 10px;border-radius:20px;margin-bottom:12px}
  .big{font-family:"Anton",sans-serif;font-weight:400;line-height:1.03;font-size:37px;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.55)}
  .big em{font-style:normal;color:var(--sage)}
  .sub{font-size:14.5px;line-height:1.45;margin-top:12px;color:#eef5f0;font-weight:600;text-shadow:0 1px 8px rgba(0,0,0,.6)}
  .sub b{color:var(--sage)}
  .src{font-size:10.5px;color:var(--sage-soft);opacity:.85;margin-top:10px}
  .mapcard{background:rgba(11,18,13,.5);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:12px}
  .mapcard svg{display:block;width:100%;height:auto}
  .pin{opacity:0;transition:opacity .5s ease .1s}
  .frame.on .pin{opacity:1}.frame.on .pin.d2{transition-delay:.35s}.frame.on .pin.d3{transition-delay:.6s}
  .bars{display:flex;flex-direction:column;gap:10px;margin-top:4px}
  .barrow{display:flex;align-items:center;gap:9px}
  .barrow .lab{width:104px;font-size:12.5px;font-weight:800;text-align:right;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.7)}
  .barrow .tr{flex:1;height:28px;border-radius:8px;background:rgba(255,255,255,.1);overflow:hidden}
  .barrow .fl{height:100%;width:0;border-radius:8px;transition:width 1.1s cubic-bezier(.2,.8,.2,1);display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:12.5px;font-weight:800;color:var(--dark);white-space:nowrap}
  .frame.on .fl{width:var(--w)}
  .fl.a{background:var(--sage)}.fl.b{background:var(--sage-soft)}.fl.c{background:var(--sage-dim);color:#0c140f}
  .trendwrap{display:flex;align-items:center;gap:14px;margin-top:6px}
  .trendwrap .pct{font-family:"Anton";font-size:52px;color:var(--sage);line-height:.9;text-shadow:0 2px 14px rgba(0,0,0,.5)}
  .spark{flex:1}.spark svg{display:block;width:100%;height:auto;overflow:visible}
  .spark .ln{stroke:var(--sage);stroke-width:4;fill:none;stroke-linecap:round;stroke-dasharray:240;stroke-dashoffset:240;transition:stroke-dashoffset 1.2s ease .2s}
  .frame.on .spark .ln{stroke-dashoffset:0}
  .spark .ar{fill:var(--sage);opacity:0;transition:opacity .4s ease 1.1s}.frame.on .spark .ar{opacity:1}
  .cta-box{background:rgba(11,18,13,.66);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:16px 16px 18px}
  .cta-box .dm{font-family:"Anton";font-size:29px;line-height:1.05;color:#fff}
  .cta-box .dm em{font-style:normal;color:var(--sage)}
  .cta-row{display:flex;gap:8px;margin-top:12px}
  .cta-row .b{flex:1;text-align:center;font-size:13px;font-weight:800;padding:9px;border-radius:11px}
  .cta-row .save{background:#fff;color:var(--dark)}.cta-row .dmbtn{background:var(--sage);color:var(--dark)}
  .audio{position:absolute;left:14px;right:14px;bottom:20px;z-index:6;display:flex;align-items:center;gap:8px;font-size:12px;color:#eef5f0;font-weight:600}
  .audio .track{flex:1;overflow:hidden;white-space:nowrap;-webkit-mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
  .audio .track span{display:inline-block;padding-left:100%;animation:mq 9s linear infinite}
  @keyframes mq{to{transform:translateX(-100%)}}
  .side{position:absolute;right:10px;bottom:96px;z-index:6;display:flex;flex-direction:column;gap:16px;align-items:center;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6)}
  .side div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700}
  .side .g{font-size:22px;line-height:1}
</style></head>
<body>
<div class="stage">
  <div class="bg" id="bg">
    <svg id="mapbg" width="100%" height="100%" viewBox="0 0 360 640" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e3327"/><stop offset="1" stop-color="#0e1712"/></linearGradient></defs>
      <rect width="360" height="640" fill="url(#sky)"/>
      <g fill="#18291f"><rect x="20" y="60" width="90" height="70" rx="4"/><rect x="130" y="40" width="70" height="90" rx="4"/><rect x="220" y="70" width="110" height="60" rx="4"/><rect x="30" y="160" width="80" height="90" rx="4"/><rect x="250" y="170" width="90" height="80" rx="4"/><rect x="20" y="300" width="100" height="80" rx="4"/><rect x="240" y="320" width="100" height="70" rx="4"/><rect x="120" y="430" width="90" height="70" rx="4"/><rect x="20" y="470" width="80" height="90" rx="4"/><rect x="250" y="470" width="90" height="90" rx="4"/></g>
      <g stroke="#263a2d" stroke-width="10" fill="none"><path d="M0 145 H360"/><path d="M0 285 H360"/><path d="M0 415 H360"/><path d="M115 0 V640"/><path d="M225 0 V640"/></g>
      <path d="M-10 250 L370 360" stroke="#9dc0aa" stroke-width="11" fill="none" opacity=".9"/>
      <path d="M-10 250 L370 360" stroke="#e7f2ea" stroke-width="3" fill="none" stroke-dasharray="2 12"/>
    </svg>
  </div>
  <div class="scrim"></div>
  <div class="prog" id="prog"></div>
  <div class="who"><div class="av">E</div><div class="nm" id="who">edilnordre<span>Immobiliare · Brugherio</span></div></div>
  <div class="side"><div><span class="g">🤍</span>512</div><div><span class="g">💬</span>27</div><div><span class="g">↪</span>DM</div><div><span class="g">🔖</span>salva</div></div>
  <div class="cap" id="cap">
    <div class="frame" data-i="0"><div class="big" id="hook"></div><div class="sub" id="hookSub"></div></div>
    <div class="frame" data-i="1"><span class="eyebrow" id="mapTitle"></span>
      <div class="mapcard"><svg viewBox="0 0 300 210" xmlns="http://www.w3.org/2000/svg">
        <path d="M40 30 Q150 10 265 40 Q285 110 250 180 Q150 205 55 175 Q20 100 40 30 Z" fill="#12211a" stroke="#2b3f33" stroke-width="2"/>
        <circle cx="205" cy="70" r="42" fill="#9dc0aa" opacity=".30"/><circle cx="150" cy="120" r="46" fill="#9dc0aa" opacity=".18"/><circle cx="80" cy="150" r="34" fill="#fff" opacity=".08"/>
        <g stroke="#2b3f33" stroke-width="3" fill="none" opacity=".8"><path d="M40 90 Q150 70 260 100"/><path d="M60 150 Q160 140 250 160"/><path d="M150 20 V190"/></g>
        <g class="pin"><rect x="164" y="44" width="82" height="26" rx="13" fill="#9dc0aa"/><text id="z0v" x="205" y="61" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" font-weight="800" fill="#152319"></text><text id="z0n" x="205" y="92" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" font-weight="800" fill="#e7f2ea"></text></g>
        <g class="pin d2"><rect x="112" y="106" width="76" height="26" rx="13" fill="#c9ddcf"/><text id="z1v" x="150" y="123" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" font-weight="800" fill="#152319"></text><text id="z1n" x="150" y="152" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" font-weight="800" fill="#e7f2ea"></text></g>
        <g class="pin d3"><rect x="40" y="150" width="78" height="24" rx="12" fill="#fff"/><text id="z2v" x="79" y="166" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="800" fill="#152319"></text><text id="z2n" x="79" y="192" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" font-weight="800" fill="#e7f2ea"></text></g>
      </svg></div>
      <div class="src" id="mapSrc"></div>
    </div>
    <div class="frame" data-i="2"><span class="eyebrow" id="barsTitle"></span>
      <div class="bars" id="bars"></div>
      <div class="sub" style="font-size:13.5px" id="barsNote"></div>
    </div>
    <div class="frame" data-i="3"><span class="eyebrow" id="trendTitle"></span>
      <div class="trendwrap"><div class="pct" id="trendPct"></div><div class="spark"><svg viewBox="0 0 140 70" xmlns="http://www.w3.org/2000/svg"><polyline class="ln" points="4,60 34,52 64,40 94,28 126,10"/><path class="ar" d="M126 10 l-13 2 l7 8 z"/></svg></div></div>
      <div class="sub" id="trendNote"></div>
    </div>
    <div class="frame" data-i="4"><div class="cta-box"><div class="dm" id="ctaQ"></div><div class="sub" style="margin-top:8px" id="ctaSub"></div><div class="cta-row"><span class="b save">🔖 Salva</span><span class="b dmbtn">✉️ Scrivi in DM</span></div></div></div>
  </div>
  <div class="audio"><span>♫</span><div class="track"><span id="audio"></span></div></div>
</div>
<script>
  // Dati di default (esempio) — sovrascritti da window.REEL (render) o da __apply (anteprima app).
  var DEFAULT = {
    handle:"edilnordre", sub:"Immobiliare · Brugherio",
    hook:"A Brugherio<br>casa tua vale<br><em>1.000</em> o <em>2.810</em>€/mq?",
    hookSub:"Cambia tutto in 2 km. Dipende dalla via.",
    mapTitle:"La mappa del valore · Brugherio",
    zones:[{name:"San Damiano",value:"2.810 €",w:"100%"},{name:"Centro",value:"2.500 €",w:"89%"},{name:"Periferia",value:"1.000 €",w:"36%"}],
    mapSrc:"Fonte: quotazioni OMI + mercato · media città 2.725 €/mq",
    barsTitle:"Il divario, in chiaro",
    bars:[{icon:"🏡",name:"San Damiano",value:"2.810 €/mq",w:"100%",cls:"a"},{icon:"🏢",name:"Centro",value:"2.500 €/mq",w:"89%",cls:"b"},{icon:"🌳",name:"Periferia",value:"1.000 €/mq",w:"36%",cls:"c"}],
    barsNote:"Tra la zona più cara e la più economica: <b>quasi 3 volte</b>.",
    trendTitle:"E il mercato sale", trendPct:"+7,4%",
    trendNote:"In 6 mesi. Casa tua oggi vale più di ieri — anche se non l'hai toccata.",
    ctaQ:"La tua via in che <em>fascia</em> è?",
    ctaSub:"Scrivimi la via in DM: ti mando il valore al mq aggiornato della tua zona.",
    audio:"audio di tendenza · original audio — edilnordre · prezzi immobili Brugherio 2026",
    bg:null
  };
  function set(id,html){var e=document.getElementById(id);if(e&&html!=null)e.innerHTML=html;}
  // Applica i dati: i campi assenti restano quelli già a schermo (default esempio).
  function applyData(D){
    D=D||{};
    set("hook",D.hook);set("hookSub",D.hookSub);set("mapTitle",D.mapTitle);set("mapSrc",D.mapSrc);
    set("barsTitle",D.barsTitle);set("barsNote",D.barsNote);set("trendTitle",D.trendTitle);
    set("trendPct",D.trendPct);set("trendNote",D.trendNote);set("ctaQ",D.ctaQ);set("ctaSub",D.ctaSub);set("audio",D.audio);
    if(D.handle){document.getElementById("who").innerHTML=D.handle+"<span>"+(D.sub||"")+"</span>";}
    if(D.zones){D.zones.slice(0,3).forEach(function(z,i){set("z"+i+"v",z.value);set("z"+i+"n",z.name);});}
    if(D.bars){var bc=document.getElementById("bars");bc.innerHTML="";D.bars.forEach(function(b){
      var row=document.createElement("div");row.className="barrow";
      row.innerHTML='<div class="lab">'+(b.icon||"")+" "+b.name+'</div><div class="tr"><div class="fl '+(b.cls||"a")+'" style="--w:'+b.w+'">'+b.value+'</div></div>';
      bc.appendChild(row);
    });}
    if(D.bg||D.bgVideo){
      var bgEl=document.getElementById("bg");var mb=document.getElementById("mapbg");if(mb)mb.style.display="none";
      var old=bgEl.querySelector("img,video");if(old)old.remove();
      if(D.bgVideo){var v=document.createElement("video");v.src=D.bgVideo;v.muted=true;v.loop=true;v.autoplay=true;v.playsInline=true;v.setAttribute("playsinline","");bgEl.appendChild(v);}
      else{var im=document.createElement("img");im.src=D.bg;bgEl.appendChild(im);}
    }
  }
  applyData(window.REEL || DEFAULT);

  // Durata per singolo frame (indice = data-i). ORDER = quali frame giocare e in che ordine.
  // modo "dati" = tutti (hook, mappa, barre, trend, cta). modo "video" = solo hook + cta.
  var DURS=[2800,4000,3600,3600,4600];
  var ORDER=[0,1,2,3,4];
  var frames=[].slice.call(document.querySelectorAll('.frame'));
  var prog=document.getElementById('prog');
  var segEls=[];
  function buildProg(){prog.innerHTML="";segEls=ORDER.map(function(){var s=document.createElement('div');s.className='seg';var f=document.createElement('i');s.appendChild(f);prog.appendChild(s);return f;});}
  // modi: video=hook+cta · dati=hook+barre+cta · dati_trend=+frame trend · full=tutti (mappa inclusa, per render/esempio)
  function setModo(modo){var map={video:[0,4],dati:[0,2,4],dati_trend:[0,2,3,4],full:[0,1,2,3,4]};ORDER=map[modo]||map.full;window.__dur=ORDER.reduce(function(a,i){return a+DURS[i];},0);buildProg();}
  function show(k){var fi=ORDER[k];frames.forEach(function(f){f.classList.remove('on');});frames[fi].classList.add('on');
    segEls.forEach(function(b,j){b.style.transition='none';b.style.width=(j<k?100:0)+'%';});
    var b=segEls[k];void b.offsetWidth;b.style.transition='width '+DURS[fi]+'ms linear';b.style.width='100%';
    if(k+1<ORDER.length)setTimeout(function(){show(k+1);},DURS[fi]);}
  setModo("full");
  window.__start=function(){show(0);};
  // Pilotaggio dall'app (anteprima in iframe): applica dati (+ modo) e cicla in loop.
  window.__apply=function(nd){applyData(nd);if(nd&&nd.modo)setModo(nd.modo);};
  window.__loop=function(){(function run(){show(0);setTimeout(run,window.__dur+900);})();};
</script>
</body></html>
